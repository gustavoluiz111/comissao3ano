<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área Comissão — Comissão 3º Ano EAPC 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<div class="brand"><h1>Área Restrita — Comissão</h1></div>
<nav class="nav">
<a href="index.html">Início</a>
<a href="alunos.html">Alunos</a>
<a href="vendas.html">Vendas</a>
<a href="camisa.html">Camisa</a>
<a href="avisos.html">Avisos</a>
<a href="comissao.html" class="btn-comissao">Área Comissão</a>
</nav>
</header>


<main class="container">
<div id="login-box" class="login-box">
<h2>Login Comissão</h2>
<input id="input-senha" type="password" placeholder="Senha da comissão">
<button id="btn-login">Entrar</button>
<p class="small">Senha local — mude no arquivo js/script.js</p>
</div>


<div id="painel-comissao" style="display:none">
<h2>Painel Financeiro</h2>


<div class="financas">
<div>
<h3>Arrecadado</h3>
<div id="valor-arrecadado">R$ 4.200,00</div>
</div>
<div>
<h3>Gastos</h3>
<div id="valor-gastos">R$ 1.300,00</div>
</div>
<div>
<h3>Saldo</h3>
<div id="valor-saldo">R$ 2.900,00</div>
</div>
</div>


<h3>Controle (Editar valores)</h3>
<div class="form-inline">
<input id="input-arrecada" placeholder="Adicionar arrecadação (ex: 200)" />
<button id="btn-add-arrecada">Adicionar</button>


<input id="input-gasto" placeholder="Adicionar gasto (ex: 50)" />
<button id="btn-add-gasto">Adicionar</button>
</div>


<h3>Exportar</h3>
<button id="btn-export-csv">Exportar balanço CSV</button>
</div>


</main>


<footer class="footer"><small>Comissão 3º Ano • EAPC 2026</small></footer>
<script src="js/script.js"></script>
</body>
</html>
